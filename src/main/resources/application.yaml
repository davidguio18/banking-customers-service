spring:
  application:
    name: banking-customers-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking_customers_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: customers

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

customers:
  messaging:
    exchange: ${CUSTOMERS_EXCHANGE:customers.events}
