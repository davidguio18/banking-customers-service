spring:
  application:
    name: banking-customers-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/banking_customers_db}
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: customers

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

customers:
  messaging:
    exchange: customers.events
