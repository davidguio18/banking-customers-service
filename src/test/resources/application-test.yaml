server:
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:h2:mem:banking_customers_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS customers
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_schema: customers
        dialect: org.hibernate.dialect.H2Dialect

  rabbitmq:
    listener:
      simple:
        auto-startup: false
